<!DOCTYPE html>
<html>
<body>

<h2>Contact Us</h2>

<form id="emailForm">
  <input type="text" id="name" placeholder="Your Name" required><br><br>
  <input type="email" id="email" placeholder="Your Email" required><br><br>
  <input type="text" id="subject" placeholder="Subject" required><br><br>
  <textarea id="message" placeholder="Message"></textarea><br><br>
  <button onclick="msg();">Send Email</button>
</form>

<p id="status"></p>
<script src="https://script.google.com/macros/library/d/12Wpmq6rZONwTNoS676vUVgPI2q1PH-kgD0MM8U8OPU27aTyWsjiYWSAb/2"></script>
<script>


  function msg() {
    yourData = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      subject: document.getElementById("subject").value,
      message: document.getElementById("message").value
    };
    alert("Your message has been sent successfully!");
    fetch('https://script.google.com/macros/s/AKfycbyT_xyUjCkVNNTigLQxEbSj3ZUcr3sLf_-xiolI0tktPwCd17LPKTT8ebTMxL5CsK5v/exec', {
  method: 'POST',
  mode: 'no-cors', // This can sometimes bypass preflight, but you won't see the response body
  body: JSON.stringify(yourData)
})
  }
</script>

</body>
</html>
